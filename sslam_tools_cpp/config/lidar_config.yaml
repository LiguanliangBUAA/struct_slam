/**:
  ros__parameters:
    HFOV: 360.0
    COLS: 1024
    VFOV: 22.5
    ROWS: 32

    input_type: "pointcloud2" # custom_msg / pointcloud2
    height_filter_flag: "elevation_grid_filter" # normal / elevation_grid_filter
    MIN_Z: -2000.0
    MAX_Z: 2000.0
    GRID_SIZE: 10.0 # mm
    Z_DIFF_THRESHOLD: 30.0
    POINT_COUNT_THRESHOLD: 0

    scale_to_mm: 1000.0
    accumulate_packets: 1

    publish_pointcloud: true

    # Level the point cloud (remove roll/pitch, keep yaw) using the latest
    # odometry orientation before height-filtering and BEV projection.
    gravity_compensation: true
    # Move every point, by its own timestamp, into the sensor frame at the frame's stamp
    # (latest point) using odometry, so an accumulated frame is one consistent snapshot
    # while the UAV moves/turns. Needs per-point time (Livox CustomMsg); no-op otherwise.
    deskew: true
    odometry_topic: "/odom"

    # structure filter: remove small non-structural objects (people, poles, clutter) before the BEV projection (false)
    structure_filter_flag: false
    # structure filter cell size, mm (100)
    structure_grid_size: 100.0
    # minimum horizontal length of a connected cluster to keep, mm (500)
    structure_min_width: 500.0
    # empty cells bridged when connecting a cluster (2)
    structure_gap_cells: 2
